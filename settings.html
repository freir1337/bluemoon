<div class="bm2_ext_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>🌙 BlueMoon: Relationships & Style v2.3</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="bm2_settings_block">
                <p class="bm2_settings_hint">
                    Управление сетью отношений (Бот, Персона, NPC), интерактивным древом связей (Obsidian Graph), жанрами и ползунками стиля. Панель открывается через меню <b>Волшебной палочки (🪄)</b> возле поля ввода чата или кнопкой ниже.
                </p>

                <label class="checkbox_label" for="bm2_master_enabled">
                    <input type="checkbox" id="bm2_master_enabled" />
                    <span>Включить BlueMoon (Мастер-переключатель)</span>
                </label>

                <label class="checkbox_label" for="bm2_rel_enabled">
                    <input type="checkbox" id="bm2_rel_enabled" />
                    <span>Строго вшивать сеть отношений и NPC в промпт ИИ</span>
                </label>

                <label class="checkbox_label" for="bm2_rel_auto_analyze">
                    <input type="checkbox" id="bm2_rel_auto_analyze" />
                    <span>Авто-сканирование всех связей (Персонажи + NPC) после каждого ответа</span>
                </label>

                <label class="checkbox_label" for="bm2_isolate_per_chat">
                    <input type="checkbox" id="bm2_isolate_per_chat" />
                    <span>Отдельная копия связей для каждой ветки чата (с авто-наследованием NPC при создании ветки)</span>
                </label>

                <label class="checkbox_label" for="bm2_style_enabled">
                    <input type="checkbox" id="bm2_style_enabled" />
                    <span>Строго вшивать жанры, автора и силу ползунков в промпт ИИ</span>
                </label>

                <hr />

                <div class="bm2_field_row">
                    <label for="bm2_connection_profile">Профиль подключения для ИИ-анализа и Древа:</label>
                    <select id="bm2_connection_profile" class="text_pole">
                        <option value="">Текущий активный API чата</option>
                    </select>
                </div>

                <div class="bm2_field_row">
                    <label for="bm2_injection_depth">Глубина инъекции промпта (Depth — рекомендуем 1):</label>
                    <input type="number" id="bm2_injection_depth" class="text_pole" min="0" max="10" step="1" value="1" />
                </div>

                <div class="bm2_settings_actions">
                    <button id="bm2_open_hub_btn" class="menu_button interactable" type="button">
                        🌙 Открыть панель BlueMoon
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
