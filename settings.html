<div id="bm2_settings_container" class="bm2_settings_wrapper">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>🌙 BlueMoon v2.1 (Связи, Древо и Стиль)</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content bm2_drawer_body">
            <p class="bm2_hint">
                Трекер отношений (Бот + Персона + NPC), интерактивное древо связей с фото, кастомные ползунки стиля и темы. Открывается через <b>Волшебную палочку (🪄)</b> возле поля ввода чата.
            </p>

            <label class="checkbox_label" for="bm2_master_enabled">
                <input id="bm2_master_enabled" type="checkbox" />
                <span>Включить расширение BlueMoon</span>
            </label>

            <label class="checkbox_label" for="bm2_rel_enabled">
                <input id="bm2_rel_enabled" type="checkbox" />
                <span>Отправлять ИИ сеть отношений (Бот, Персона, NPC)</span>
            </label>

            <label class="checkbox_label" for="bm2_rel_auto_analyze">
                <input id="bm2_rel_auto_analyze" type="checkbox" />
                <span>Авто-изменение % отношений после ответов бота</span>
            </label>

            <label class="checkbox_label" for="bm2_isolate_per_chat">
                <input id="bm2_isolate_per_chat" type="checkbox" />
                <span>Отдельное древо для каждого нового чата (даже у одного бота)</span>
            </label>

            <label class="checkbox_label" for="bm2_style_enabled">
                <input id="bm2_style_enabled" type="checkbox" />
                <span>Включить ползунки стиля и подачу текста</span>
            </label>

            <hr class="bm2_divider" />

            <div class="bm2_field_group">
                <label for="bm2_connection_profile">Профиль API (для анализа % и ИИ-построения древа):</label>
                <div class="bm2_row">
                    <select id="bm2_connection_profile" class="text_pole bm2_select">
                        <option value="">Текущее подключение (Main API)</option>
                    </select>
                    <button id="bm2_refresh_profiles" class="menu_button bm2_icon_btn" type="button" title="Обновить список профилей">
                        <i class="fa-solid fa-rotate"></i>
                    </button>
                </div>
            </div>

            <div class="bm2_field_group">
                <label for="bm2_injection_depth">Глубина вставки промпта (Depth):</label>
                <input id="bm2_injection_depth" type="number" class="text_pole" min="0" max="20" step="1" value="1" />
            </div>

            <div class="bm2_actions_stack">
                <button id="bm2_open_panel_btn" class="menu_button bm2_primary_btn" type="button">
                    <i class="fa-solid fa-moon"></i> Открыть BlueMoon
                </button>
            </div>
        </div>
    </div>
</div>
